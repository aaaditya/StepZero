  <!-- Performance hints -->

  <!-- Structured Data: Organization + WebSite -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@graph": [
      {
        "@type": "Organization",
        "@id": "https://stepzero.studio/#organization",
        "name": "StepZero",

        "email": "hello@stepzero.studio",

      },
      {

        "url": "https://stepzero.studio/",

      {

    ]
  }
  </script>

  <style>
    html, body {
      height: 100%;
      margin: 0;
      background-color: #FAFAF8;
      color: #111111;
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    }
    /* Skip link — visible on keyboard focus (accessibility / CWV a11y). */
    .skip-link {
      position: absolute;
      left: 12px;
      top: -48px;
      z-index: 10000;
      padding: 10px 14px;
      background: #111111;
      color: #ffffff;
      border-radius: 8px;
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
      transition: top 0.15s ease;
    }
    .skip-link:focus {
      top: 12px;
      outline: 2px solid #5B5FEF;
      outline-offset: 2px;
    }
    #flutter-loading {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      background: #FAFAF8;
      pointer-events: none;
      transition: opacity 0.45s cubic-bezier(0.22, 1, 0.36, 1);
    }
    #flutter-loading[data-hidden="true"] {
      opacity: 0;
    }
    #flutter-loading .brand {
      text-align: center;
    }
    #flutter-loading .logo-mark {
      width: 48px;
      height: 48px;
      margin: 0 auto 18px;
      border-radius: 14px;
      background: linear-gradient(135deg, #5B5FEF 0%, #8B8FF7 100%);
      box-shadow: 0 12px 40px rgba(91, 95, 239, 0.28);
      animation: sz-breathe 2.4s ease-in-out infinite;
    }
    #flutter-loading .mark {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -0.04em;
      color: #111111;
      animation: sz-rise 0.7s cubic-bezier(0.22, 1, 0.36, 1) both;
    }
    #flutter-loading .sub {
      margin-top: 8px;
      font-size: 14px;
      color: #6B7280;
      animation: sz-rise 0.7s 0.12s cubic-bezier(0.22, 1, 0.36, 1) both;
    }
    @keyframes sz-breathe {
      0%, 100% { transform: scale(1); box-shadow: 0 12px 40px rgba(91, 95, 239, 0.22); }
      50% { transform: scale(1.04); box-shadow: 0 16px 48px rgba(91, 95, 239, 0.34); }
    }
    @keyframes sz-rise {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @media (prefers-reduced-motion: reduce) {
      #flutter-loading .logo-mark,
      #flutter-loading .mark,
      #flutter-loading .sub {
        animation: none !important;
      }
    }
    noscript .noscript-shell {
      max-width: 720px;
      margin: 48px auto;
      padding: 0 24px;
      line-height: 1.6;
    }
    noscript h1 { font-size: 2rem; letter-spacing: -0.03em; }
    noscript a { color: #5B5FEF; }
  </style>
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to main content</a>
  <div id="main-content" tabindex="-1"></div>

  <div id="flutter-loading" aria-live="polite" aria-busy="true">
    <div class="brand">
      <div class="logo-mark" aria-hidden="true"></div>
      <div class="mark">StepZero</div>
      <div class="sub">Loading…</div>
    </div>
  </div>

  <!-- Crawlable fallback when JS is disabled (SEO / progressive enhancement). -->
  <noscript>
    <main class="noscript-shell">
      <h1>StepZero</h1>
      <p>We build businesses people trust.</p>
      <p>Helping local businesses become premium brands through strategy, branding, websites, AI automation, and digital growth.</p>
      <ul>
        <li><a href="/services">Services</a></li>
        <li><a href="/work">Work</a></li>
        <li><a href="/articles">Insights</a></li>
        <li><a href="/pricing">Pricing</a></li>
        <li><a href="/contact">Contact</a></li>
      </ul>
      <p>Email: <a href="mailto:hello@stepzero.studio">hello@stepzero.studio</a></p>
    </main>
  </noscript>

  <script>
    // Hide splash once Flutter paints (improves perceived LCP).
    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('flutter-loading');
      if (!el) return;
      el.setAttribute('data-hidden', 'true');
      el.setAttribute('aria-busy', 'false');
      setTimeout(function () { el.remove(); }, 480);
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
