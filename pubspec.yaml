name: stepzero
description: Official website for StepZero — a premium business growth studio.
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter

  # State management — compile-safe DI + reactive UI
  flutter_riverpod: ^3.3.2

  # Declarative, URL-based navigation for Flutter web
  go_router: ^17.0.0

  # Inter typeface via Google Fonts CDN (self-host later for prod perf)
  google_fonts: ^6.3.2

  # Declarative, performant motion primitives
  flutter_animate: ^4.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
